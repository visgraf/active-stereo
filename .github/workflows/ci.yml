name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,cv]"
      - name: Lint
        run: ruff check src tests experiments
      - name: Format check
        run: ruff format --check src tests experiments
      - name: Types
        run: mypy src
      - name: Test
        run: pytest -q --cov=activestereo --cov-report=term-missing

  regression-guard:
    # The ADR-backed tests are the memory of this project. Surfacing them as a
    # separate job means a failure names the decision that was violated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Regression tests (ADR-backed)
        run: pytest tests/regression -v -m regression
