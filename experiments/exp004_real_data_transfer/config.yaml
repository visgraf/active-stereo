defaults: [../../configs/scene/middlebury2014.yaml]
experiment:
  tag: exp004
  issue: 6
  hypothesis: >
    H1 (the calibration asymmetry transfers): on real photographs, reported
    disparity variance still fails to flag half-occlusions -- estimates there are
    fabricated but labelled nearly as confident as genuine matches, as exp003
    found on rendered charts (5x inflation against 637x for texture loss).
    H1b (peek-derived, held-out only): block matching's variance in
    half-occlusions is not merely under-inflated but LOWER than in matched
    regions, which would be sharper than exp003 and in the opposite direction.
    H2 (brightness constancy fabricates evidence): replacing the right image with
    im1E (different exposure) or im1L (different lighting), geometry and ground
    truth untouched, raises error sharply while coverage stays flat -- the
    opposite signature to exp003's texture loss, where coverage collapsed.
  acceptance: >
    H1 falsified if block matching's median-over-scenes variance ratio
    (occluded / matched) exceeds 20, or if its occlusion hallucination rate falls
    below 40% (half of exp001's 79.6% on random dots). H1b falsified if the ratio
    is >= 1.0 in three or more of the held-out scenes (a count, not a
    proportion: the count is what was written down, and two declared peeks
    reduced the held-out set from nine to eight). H2 falsified if
    coverage drops by more than 10 percentage points (the withheld-evidence
    signature), or if median |delta d| rises by less than 25% (no effect).
    Statistics are medians over scenes; per-scene numbers reported in full.
  declared_peek: >
    (1) Adirondack was run through both matchers during loader validation, and
    its coverage, bad-2.0, hallucination rate and variance ratios were seen
    (docs/lab-notebook/2026-08-18-middlebury-adoption.md). H1 is therefore
    contaminated on one scene of ten. The primary analysis is the eight scenes
    seen by neither peek; Adirondack is reported separately and labelled, never
    pooled into a headline. H1b was generated by that peek and is confirmatory
    only on held-out scenes.
    (2) DISCLOSED BEFORE THE CONFIRMATORY RUN, as a comment on issue #6: while
    smoke-testing this runner's plumbing on Adirondack and Jadeplant, the H2
    verdicts for Jadeplant were printed and seen. So H2 is contaminated on
    Jadeplant, and the claim in (1) that "H2 is clean" no longer holds for that
    scene. No threshold was changed afterwards, and none can be: the falsifiers
    were fixed in issue #6, which is timestamped before the smoke test. Both
    Adirondack and Jadeplant are excluded from the pooled statistics and reported
    separately.

analysis:
  # Excluded from every pooled statistic. Not excluded from the run -- discarding
  # them would not unsee the numbers, and reporting them beside the held-out set
  # is more informative than pretending.
  #   Adirondack -- loader validation, H1 quantities
  #   Jadeplant  -- runner smoke test, H2 verdicts
  seen_scenes: [Adirondack, Jadeplant]

  # Control 3: our matched mask reproduces Middlebury's generator exactly, which
  # validates the implementation and says nothing about whether 1.0 px is the
  # right threshold. If the occlusion fraction moves a lot across these, every
  # occlusion number inherits that sensitivity.
  tolerance_sweep: [0.5, 1.0, 2.0]

  # Control 4: the confound that could fake H1. If occluded regions are simply
  # low-contrast, a variance result there is exp003's texture effect wearing
  # occlusion's clothing. Split occluded pixels at the median local contrast of
  # matched pixels and report the high-contrast cell separately.
  contrast_window: 7

matchers: [block, sgbm]
