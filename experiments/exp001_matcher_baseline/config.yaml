defaults: [../../configs/scene/rds_disk.yaml]
experiment:
  tag: exp001
  hypothesis: >
    With the ADR-0003 foveal confinement term active, SGBM achieves lower foveal
    depth error than block matching at equal disparity range, and hallucinates
    less in half-occluded regions. Without the term, the depth-error difference
    is not detectable.
  acceptance: >
    Median absolute foveal depth error is lower for SGBM by a margin exceeding
    the seed-to-seed spread across 5 seeds, AND SGBM's hallucination rate in
    ground-truth occlusions is lower than block matching's.
matcher:
  max_disparity: 48
  window: 7
seeds: [0, 1, 2, 3, 4]
