[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activestereo"
version = "0.1.0"
description = "Six-layer active Bayesian inference framework for stereoscopic 3D vision"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Luiz Velho", email = "lvelho@impa.br" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = ["opencv-python-headless>=4.8"]
# Reading named layers out of Blender's multi-layer EXR. OpenCV cannot do this
# (it silently returns whichever channels come first). See ADR-0010.
blender = ["OpenImageIO>=2.5"]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pinned exactly: ruff format is the CI gate, and each ruff release can
    # move it. 0.16.4 reformats 3 files that 0.16.3 accepts; an unpinned CI
    # was red for days on main through no fault of any PR. Bump deliberately,
    # reformatting in the same commit.
    "ruff==0.16.4",
    "mypy>=1.8",
    "hypothesis>=6.90",
]

[project.scripts]
astereo = "activestereo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (renders, full pipelines)",
    "requires_cv2: needs OpenCV installed",
    "regression: encodes a lesson learned; see the referenced ADR",
    "integration: exercises several layers end to end",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "NPY", "RUF"]
ignore = ["N803", "N806"]  # allow math-style names: X, Z, K, R

[tool.mypy]
# python_version is deliberately unset so mypy follows the running interpreter.
# Pinning it below 3.12 makes mypy parse third-party stubs with an old grammar;
# numpy's stubs use PEP 695 `type X = ...` and the check aborts outright.
packages = ["activestereo"]
ignore_missing_imports = true
disallow_untyped_defs = true
# A `type: ignore` is a place the checker has been told to stop looking. Flag any
# that are no longer needed so the count trends down, not up.
warn_unused_ignores = true
